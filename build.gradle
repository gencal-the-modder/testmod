plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.google.protobuf' version '0.9.4'


}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

afterEvaluate {
	sourceSets {
		main {
			java {
				def mainProtoDir = 'build/generated/source/proto/main/java'
				def mainGrpcDir = 'build/generated/source/proto/main/grpc'
				if (!file(mainProtoDir).exists()) srcDirs += mainProtoDir
				if (!file(mainGrpcDir).exists()) srcDirs += mainGrpcDir
			}
		}
		client {
			java {
				def clientProtoDir = 'build/generated/source/proto/client/java'
				def clientGrpcDir = 'build/generated/source/proto/client/grpc'
				if (!file(clientProtoDir).exists()) srcDirs += clientProtoDir
				if (!file(clientGrpcDir).exists()) srcDirs += clientGrpcDir
			}
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"testmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation 'io.grpc:grpc-netty-shaded:1.60.0'
	implementation 'io.grpc:grpc-protobuf:1.60.0'
	implementation 'io.grpc:grpc-stub:1.60.0'

	implementation 'com.google.protobuf:protobuf-java:3.25.3'
	annotationProcessor 'com.google.protobuf:protobuf-java:3.25.3'

	implementation 'javax.annotation:javax.annotation-api:1.3.2'


//	implementation 'org.hibernate:hibernate-bytecode-bytebuddy:6.6.0.Final'

	implementation 'org.hibernate:hibernate-core:6.3.2.Final'
	implementation 'org.postgresql:postgresql:42.6.0'

	implementation 'org.springframework.data:spring-data-jpa:3.3.0'



}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.25.3'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.60.0'
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
