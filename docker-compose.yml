version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: testmod-postgres
    environment:
      POSTGRES_DB: testmod_db
      POSTGRES_USER: testmod_user
      POSTGRES_PASSWORD: testmod_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmod_user -d testmod_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
